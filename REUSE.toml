# The copyright and licence of every file that carries no header of its own (https://reuse.software/spec-3.3/).
# A source file states both in its first lines (scripts/headers writes them); what cannot carry a comment, or must not,
# is named here. In a path, `*` matches within one folder and `**` matches across folders. When several tables match
# a file, the last one counts. tests/test_every_file_states_its_copyright_and_licence.py holds this file and the
# headers together: every tracked file is covered by one of the two, and every path here matches a file.
version = 1

# Prose. A header would show in the rendered page, and souls, skills and prompts are put into an agent's prompt as
# they are. The pointer files among them are written by scripts/gen-pointers and held to a few lines.
[[annotations]]
path = ["*.md", "**/*.md", "**/*.mdc", "NOTICE"]
SPDX-FileCopyrightText = "2026 Mohammadreza Kadivar"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Data that cannot carry a comment, or that code reads line by line (a line of the command corpus is known by its
# number), and the lock files a tool writes.
[[annotations]]
path = ["*.json", "**/*.json", "**/*.txt", "*.lock"]
SPDX-FileCopyrightText = "2026 Mohammadreza Kadivar"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# Repository settings, and the two files a fixture pack copies into a worktree as they are.
[[annotations]]
path = [".gitignore", ".github/CODEOWNERS", "packs/*/files/**"]
SPDX-FileCopyrightText = "2026 Mohammadreza Kadivar"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# The starter. `cockpit init` copies it into a user's new pack, where each file becomes the user's own to edit: a
# header would put this project's name on their file, and the project's licence would follow the copy into their
# pack. So the starter alone is under 0BSD, which asks nothing of a copy: a pack made from it is its author's.
[[annotations]]
path = "starter/**"
SPDX-FileCopyrightText = "2026 Mohammadreza Kadivar"
SPDX-License-Identifier = "0BSD"

# What a build of dashboard/src wrote, and the stylesheet served beside it.
[[annotations]]
path = "dashboard/dist/**"
SPDX-FileCopyrightText = "2026 Mohammadreza Kadivar"
SPDX-License-Identifier = "AGPL-3.0-or-later"

# The Desktop bundle, written by `npm run build` from desktop/src. The build drops the sources' comments, and it
# copies in the terminal widget (@xterm/xterm, @xterm/addon-fit), which is under the MIT licence and lives nowhere
# else in this repository: so the bundle as a whole is under both. THIRD-PARTY-NOTICES.md lists what it carries.
[[annotations]]
path = "desktop/plugin.js"
SPDX-FileCopyrightText = [
  "2026 Mohammadreza Kadivar",
  "2017-2019 The xterm.js authors (https://github.com/xtermjs/xterm.js)",
  "2014-2016 SourceLair Private Company (https://www.sourcelair.com)",
  "2012-2013 Christopher Jeffrey (https://github.com/chjj/)",
]
SPDX-License-Identifier = "AGPL-3.0-or-later AND MIT"
