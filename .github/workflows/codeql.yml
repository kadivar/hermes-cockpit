name: codeql
# Static analysis of the Python kernel and the Desktop's JavaScript sources: on the release channel, on every pull
# request, and weekly (a query added upstream may find something in code that did not change).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 5 * * 2"
permissions: {}
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  analyze:
    name: analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      # the findings are uploaded to code scanning; the code is read and nothing else is written
      security-events: write
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          # the committed bundles are build output: their sources under desktop/src and dashboard/src are what is read
          config: |
            paths-ignore:
              - desktop/plugin.js
              - dashboard/dist
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
