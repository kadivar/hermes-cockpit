name: release
# A pushed tag v<version> becomes a release, when its signature is good: the tag is verified against the signers the
# owner configured, the one command CI runs is run on it, the Python and npm dependency sets are written as CycloneDX
# SBOMs, and the release carries the changelog's section for that version, the source archive, the SBOMs and a signed
# provenance for each file. A pull request never starts this workflow: only a tag pushed to this repository does.
on:
  push:
    tags: ["v*"]
permissions: {}
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  # reads the repository and nothing else: the code of the tag runs here, with no token that can write
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      # the checkout leaves the tag pointing at its commit: the tag object, with its signature, is fetched by name
      - name: The tag is signed by a configured signer
        env:
          TAG: ${{ github.ref_name }}
          # allowed signers in ssh-keygen's format (one `<principal> <key type> <key>` per line), or armored GPG public
          # keys: repository variables the owner sets. The tag's own tree is never asked: it cannot vouch for itself
          RELEASE_SIGNERS: ${{ vars.RELEASE_SIGNERS }}
          RELEASE_GPG_KEYS: ${{ vars.RELEASE_GPG_KEYS }}
        run: |
          set -euo pipefail
          git fetch --no-tags --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          if [ "$(git cat-file -t "refs/tags/${TAG}")" != "tag" ]; then
            echo "::error::${TAG} is a lightweight tag: a release needs a signed, annotated one (git tag -s)"; exit 1
          fi
          if [ -z "${RELEASE_SIGNERS}" ] && [ -z "${RELEASE_GPG_KEYS}" ]; then
            echo "::error::no signer is configured: set the repository variable RELEASE_SIGNERS (ssh allowed signers) or RELEASE_GPG_KEYS"; exit 1
          fi
          if [ -n "${RELEASE_SIGNERS}" ]; then
            printf '%s\n' "${RELEASE_SIGNERS}" > "${RUNNER_TEMP}/allowed-signers"
            git config gpg.ssh.allowedSignersFile "${RUNNER_TEMP}/allowed-signers"
          fi
          if [ -n "${RELEASE_GPG_KEYS}" ]; then
            printf '%s\n' "${RELEASE_GPG_KEYS}" | gpg --batch --import
          fi
          git verify-tag "${TAG}"
      - name: The tag names the version the tree states
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          python3 scripts/bump --check
          python3 scripts/bump --notes "${TAG#v}" > /dev/null
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install --require-hashes -r requirements-test.lock && pip install --no-deps -e .
      - run: scripts/check --json
  # builds what the release carries, still with a token that only reads
  build:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: The source archive and the release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          mkdir -p release
          git archive --format=tar.gz --prefix="hermes-cockpit-${TAG#v}/" -o "release/hermes-cockpit-${TAG#v}.tar.gz" HEAD
          python3 scripts/bump --notes "${TAG#v}" > release-notes.md
      - name: The npm dependency set as an SBOM
        working-directory: desktop
        run: |
          set -euo pipefail
          npm ci --ignore-scripts
          npm sbom --sbom-format cyclonedx > ../release/sbom-desktop.cdx.json
      # what an installation of this tag has, as plain `name==version` lines: the locked run-time set the SBOM describes
      - name: The Python dependency set
        run: grep -E '^[A-Za-z0-9][A-Za-z0-9._-]*==' requirements.lock | sed -E 's/[ ;\\].*$//' > python-requirements.txt
      - name: The Python dependency set as an SBOM
        uses: CycloneDX/gh-python-generate-sbom@39fe80937489538e12de5a7b427e078649ec44bb # v2.0.0
        with:
          input: ./python-requirements.txt
          output: ./release/sbom-python.cdx.json
          format: json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release
          path: |
            release/
            release-notes.md
          if-no-files-found: error
  # the only job that can write: it runs no code of the repository, it signs and publishes the files built above
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write        # the release itself
      id-token: write        # the provenance is signed with the run's own identity
      attestations: write    # and stored with the repository
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release
      - uses: actions/attest-build-provenance@96278af6caaf10aea03fd8d33a09a777ca52d62f # v3.2.0
        with:
          subject-path: release/*
      - name: The release, with the changelog's section as its notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "${TAG}" --verify-tag --title "${TAG}" --notes-file release-notes.md release/*
