# Weekly dependency updates, one pull request per ecosystem for the minor and patch releases (a major release comes
# alone, since it is the one that needs reading). Security updates come as they are published, whatever the schedule.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: npm
    directory: /desktop
    schedule:
      interval: weekly
    groups:
      desktop-minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
